services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: coldchain
    ports: ["5433:5432"]

  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: coldchain_test
    ports: ["5434:5432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]
  